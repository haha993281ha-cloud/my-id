
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Forest 3D Car Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#75cfff;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:10px;width:96%;left:2%;display:flex;justify-content:space-around;background:#123e35dd;color:white;padding:12px 2px;border-radius:12px;font-size:12px}
#hud span{display:block;color:#ffe33d;font-size:19px;margin-top:5px}
#controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 15px}
button{padding:17px 22px;border:0;border-radius:12px;background:#087ba9;color:white;font-size:20px;font-weight:bold}
#brake{background:#d93636}
#pause{position:absolute;right:12px;top:82px;padding:10px;font-size:14px}
#over{display:none;position:absolute;top:36%;left:10%;width:80%;background:#123e35;color:white;text-align:center;padding:20px;border-radius:15px}
#over button{background:#ff8c19}
</style>
</head>
<body>

<div id="hud">
<div>SCORE<span id="score">0</span></div>
<div>DISTANCE<span id="distance">0</span></div>
<div>COINS<span id="coins">0</span></div>
<div>SPEED<span id="speed">0</span></div>
</div>

<button id="pause">Ⅱ</button>

<div id="controls">
<div>
<button id="left">◀</button>
<button id="right">▶</button>
</div>
<button id="brake">BRAKE</button>
</div>

<div id="over">
<h1>CRASH!</h1>
<h2>Score: <span id="final">0</span></h2>
<button onclick="restart()">RESTART</button>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x80d5ff);
scene.fog=new THREE.Fog(0x80d5ff,35,130);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
camera.position.set(0,6,11);
camera.lookAt(0,1,-10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x45602b,2));

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-10,20,10);
sun.castShadow=true;
scene.add(sun);

const material=c=>new THREE.MeshStandardMaterial({color:c});

const green=material(0x318d38);
const roadMat=material(0x68645c);
const white=material(0xffffff);
const brown=material(0x57351b);
const leaves=material(0x167239);

function box(x,y,z,w,h,d,mat,parent=scene){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

// Ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,220),green);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.1,-80);
scene.add(ground);

// Road
const road=new THREE.Mesh(new THREE.PlaneGeometry(9,210),roadMat);
road.rotation.x=-Math.PI/2;
road.position.set(0,0,-85);
scene.add(road);

// Lane lines
let lines=[];
for(let i=0;i<35;i++){
 for(let x of [-1.5,1.5]){
  lines.push(box(x,.02,-i*5,.05,.02,2,white));
 }
}

// Trees
let trees=[];
function tree(x,z){
 const g=new THREE.Group();
 box(0,1.2,0,.35,2.4,.35,brown,g);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.2,10,8),leaves);
 crown.position.y=2.7;
 g.add(crown);
 g.position.set(x,0,z);
 scene.add(g);
 trees.push(g);
}
for(let i=0;i<55;i++){
 tree(-6,-i*4);
 tree(6,-i*4);
}

// CAR
const car=new THREE.Group();
scene.add(car);
car.position.set(0,0,3);

const red=material(0xd71920);
const dark=material(0x20242a);
const glass=material(0x5babc9);
const tire=material(0x111111);

// Car body
box(0,.65,0,1.65,.55,3,red,car);
box(0,1.15,-.25,1.3,.65,1.45,glass,car);

// Bonnet
box(0,.92,1,1.5,.2,.8,red,car);

// Bumpers
box(0,.45,1.56,1.65,.18,.16,dark,car);
box(0,.45,-1.56,1.65,.18,.16,dark,car);

// Wheels
let wheels=[];
for(let x of [-.9,.9]){
 for(let z of [-1,1]){
  const w=new THREE.Mesh(
   new THREE.CylinderGeometry(.36,.36,.22,16),
   tire
  );
  w.rotation.z=Math.PI/2;
  w.position.set(x,.35,z);
  car.add(w);
  wheels.push(w);
 }
}

// Headlights
for(let x of [-.5,.5]){
 box(x,.75,1.53,.3,.18,.05,material(0xffffaa),car);
}

// Obstacles
let obstacles=[];
function spawnObstacle(){
 const g=new THREE.Group();
 const rock=new THREE.Mesh(
  new THREE.DodecahedronGeometry(.65),
  material(0x777777)
 );
 rock.position.y=.6;
 g.add(rock);
 g.position.set([-3,0,3][Math.floor(Math.random()*3)],0,-100);
 scene.add(g);
 obstacles.push(g);
}

// Coins
let coinsList=[];
function spawnCoin(){
 const g=new THREE.Group();
 const c=new THREE.Mesh(
  new THREE.TorusGeometry(.4,.12,10,24),
  new THREE.MeshStandardMaterial({color:0xffd21c,metalness:.7})
 );
 c.position.y=1.1;
 g.add(c);
 g.position.set([-3,0,3][Math.floor(Math.random()*3)],0,-100);
 scene.add(g);
 coinsList.push(g);
}

// Game variables
let lane=0;
let speed=0;
const maxSpeed=100;
let distance=0,score=0,coins=0;
let playing=true,ended=false;
let spawnTime=0,coinTime=0;
let braking=false;

function left(){if(playing&&!ended)lane=Math.max(-1,lane-1)}
function right(){if(playing&&!ended)lane=Math.min(1,lane+1)}

document.getElementById("left").onclick=left;
document.getElementById("right").onclick=right;

document.getElementById("brake").ontouchstart=()=>braking=true;
document.getElementById("brake").ontouchend=()=>braking=false;
document.getElementById("brake").onmousedown=()=>braking=true;
document.getElementById("brake").onmouseup=()=>braking=false;
document.getElementById("brake").onmouseleave=()=>braking=false;

document.getElementById("pause").onclick=()=>{
 if(ended)return;
 playing=!playing;
 document.getElementById("pause").innerText=playing?"Ⅱ":"▶";
 clock.getDelta();
};

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")left();
 if(e.key==="ArrowRight")right();
 if(e.key==="ArrowDown")braking=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowDown")braking=false;
});

function crash(){
 ended=true;
 playing=false;
 document.getElementById("final").innerText=score;
 document.getElementById("over").style.display="block";
}

function restart(){
 obstacles.forEach(o=>scene.remove(o));
 coinsList.forEach(o=>scene.remove(o));
 obstacles=[];
 coinsList=[];
 lane=0;speed=0;distance=0;score=0;coins=0;
 spawnTime=0;coinTime=0;
 car.position.set(0,0,3);
 ended=false;playing=true;
 document.getElementById("over").style.display="none";
 document.getElementById("pause").innerText="Ⅱ";
 clock.getDelta();
}
window.restart=restart;

const clock=new THREE.Clock();

function update(dt){
 if(!playing||ended)return;

 // Speed gradually increases
 if(!braking){
  speed=Math.min(speed+4*dt,maxSpeed);
 }else{
  speed=Math.max(speed-35*dt,0);
 }

 // Distance
 const moveSpeed=speed*.25;
 distance+=moveSpeed*dt;
 score=Math.floor(distance);

 // Car movement
 car.position.x=THREE.MathUtils.lerp(car.position.x,lane*3,dt*7);
 car.rotation.z=THREE.MathUtils.lerp(
  car.rotation.z,-(lane*3-car.position.x)*.08,dt*5
 );

 // Wheel animation
 wheels.forEach(w=>w.rotation.x+=moveSpeed*dt*2);

 // Camera follow
 camera.position.x=THREE.MathUtils.lerp(camera.position.x,car.position.x*.3,dt*3);
 camera.lookAt(car.position.x*.3,1,-10);

 // World
 lines.forEach(m=>{
  m.position.z+=moveSpeed*dt;
  if(m.position.z>12)m.position.z-=175;
 });

 trees.forEach(t=>{
  t.position.z+=moveSpeed*dt;
  if(t.position.z>15)t.position.z=-205;
 });

 // Spawn
 spawnTime+=dt;
 coinTime+=dt;

 if(spawnTime>1.5){
  spawnObstacle();
  spawnTime=0;
 }
 if(coinTime>1.2){
  spawnCoin();
  coinTime=0;
 }

 // Obstacles
 for(let i=obstacles.length-1;i>=0;i--){
  const o=obstacles[i];
  o.position.z+=moveSpeed*dt;

  if(Math.abs(o.position.z-3)<1&&
     Math.abs(o.position.x-car.position.x)<1.2){
   crash();
  }

  if(o.position.z>12){
   scene.remove(o);
   obstacles.splice(i,1);
  }
 }

 // Coins
 for(let i=coinsList.length-1;i>=0;i--){
  const c=coinsList[i];
  c.position.z+=moveSpeed*dt;
  c.rotation.y+=dt*4;

  if(Math.abs(c.position.z-3)<1&&
     Math.abs(c.position.x-car.position.x)<1.2){
   coins++;
   score+=10;
   scene.remove(c);
   coinsList.splice(i,1);
   continue;
  }

  if(c.position.z>12){
   scene.remove(c);
   coinsList.splice(i,1);
  }
 }

 document.getElementById("score").innerText=score;
 document.getElementById("distance").innerText=Math.floor(distance)+" m";
 document.getElementById("coins").innerText=coins;
 document.getElementById("speed").innerText=Math.floor(speed)+" km/h";
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 update(dt);
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
